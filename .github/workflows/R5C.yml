name: Build LEDE (NanoPi R5C)

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Create a GitHub Release"
        default: false
        type: boolean
      reset_cache:
        description: "Reset build caches: delete stale entries and rebuild from scratch"
        required: false
        default: false
        type: boolean

  push:
    branches:
      - main
    paths:
      - "R5C.config"
      - ".github/workflows/R5C.yml"

  # schedule:
    # Every Sunday at 02:00 UTC
    # - cron: "0 2 * * 0"

permissions:
  contents: write
  actions: write # reset_cache needs the caches API to delete stale entries

concurrency:
  group: build-friendlyarm-nanopi-r5c-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai

jobs:
  build:
    name: Build FriendlyARM NanoPi R5C
    # ubuntu-26.04 images exist, but LEDE's build dependencies are only
    # verified against noble here; keep the 24.04 LTS image.
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      # ------------------------------------------------------------
      # Checkout this repository (R5C.config + workflows only)
      # ------------------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # ------------------------------------------------------------
      # Free as much disk space as possible.
      # An OpenWrt/LEDE build needs at least 25 GB available.
      # ------------------------------------------------------------
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af || true

          df -h

      # ------------------------------------------------------------
      # Install LEDE build dependencies.
      #
      # Use the real noble package names instead of Flint2.yml's list:
      #   mkisofs       -> genisoimage (mkisofs is a virtual package)
      #   p7zip/p7zip-full -> 7zip    (both are transitional packages)
      #   libz-dev      -> dropped    (already covered by zlib1g-dev)
      # A single unresolvable name aborts the whole apt transaction.
      # ------------------------------------------------------------
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            7zip \
            ack \
            antlr3 \
            asciidoc \
            autoconf \
            automake \
            autopoint \
            binutils \
            bison \
            build-essential \
            bzip2 \
            ccache \
            clang \
            cmake \
            cpio \
            curl \
            device-tree-compiler \
            ecj \
            fastjar \
            flex \
            gawk \
            genisoimage \
            gettext \
            gcc-multilib \
            g++-multilib \
            git \
            gnutls-dev \
            gperf \
            haveged \
            help2man \
            intltool \
            lib32gcc-s1 \
            libc6-dev-i386 \
            libelf-dev \
            libglib2.0-dev \
            libgmp3-dev \
            libltdl-dev \
            libmpc-dev \
            libmpfr-dev \
            libncurses-dev \
            libpython3-dev \
            libreadline-dev \
            libssl-dev \
            libtool \
            libyaml-dev \
            lld \
            llvm \
            lrzsz \
            msmtp \
            ninja-build \
            patch \
            pkgconf \
            python3 \
            python3-pip \
            python3-ply \
            python3-docutils \
            python3-pyelftools \
            qemu-utils \
            re2c \
            rsync \
            scons \
            squashfs-tools \
            subversion \
            swig \
            texinfo \
            uglifyjs \
            upx-ucl \
            unzip \
            vim \
            wget \
            xmlto \
            xxd \
            zlib1g-dev \
            zstd

      # ------------------------------------------------------------
      # Verify that the R5C seed config exists
      # ------------------------------------------------------------
      - name: Verify build configuration
        run: |
          test -f R5C.config

          echo "Target seed:"
          grep -E '^CONFIG_TARGET_' R5C.config || true

      # ------------------------------------------------------------
      # This repo only carries the configuration; the actual source
      # tree is cloned separately from coolsnowwolf/lede.
      #
      # The repository's feeds.conf.default is NOT copied: it points at
      # ImmortalWrt feeds (and the GL-MT6000 build) and is incompatible
      # with LEDE. LEDE's own feeds.conf.default is used instead.
      # ------------------------------------------------------------
      - name: Clone LEDE source
        run: |
          git clone -b master --single-branch --filter=blob:none \
            https://github.com/coolsnowwolf/lede.git lede
          cp R5C.config lede/.config

      # ------------------------------------------------------------
      # Calendar week for cache rotation. Weekly (not per-commit)
      # rotation bounds feed staleness to ~1 week while keeping
      # steady-state churn at ~1 new entry per cache per active week.
      # ------------------------------------------------------------
      - name: Cache calendar
        id: cal
        run: |
          echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # Manual "reset_cache" switch.
      #
      # A stale or poisoned dl/, .ccache or toolchain entry can break a
      # build in ways a plain re-run cannot fix: the weekly key plus the
      # restore-keys prefix keep handing back the same bad snapshot.
      # This switch deletes every cache entry owned by this workflow, so
      # all three restores miss and the run rebuilds from scratch. The
      # save steps then repopulate the very same keys with clean data,
      # so the next normal build is warm again.
      #
      # The caches API needs `permissions: actions: write`. A failed
      # listing aborts the step instead of silently pretending the reset
      # happened. If this run fails, the next one is a cold build - the
      # expected cost of a reset.
      #
      # Match on the device tag rather than a fixed key prefix so the
      # cachewrtbuild toolchain key, whose prefix the action derives
      # from mixkey, is covered as well.
      # ------------------------------------------------------------
      - name: Reset caches
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.reset_cache == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          ids="$(gh api --paginate --method GET \
            "/repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" \
            --jq '.actions_caches[] | select(.key | test("nanopi-r5c")) | .id')"

          if [ -z "${ids}" ]; then
            echo "No NanoPi R5C cache entries to reset."
            exit 0
          fi

          echo "Deleting NanoPi R5C cache entries:"
          echo "${ids}"

          while read -r id; do
            [ -n "${id}" ] || continue
            gh api --method DELETE \
              "/repos/${GITHUB_REPOSITORY}/actions/caches/${id}" \
              || echo "::warning::Failed to delete cache ${id}" >&2
          done <<< "${ids}"

      # ------------------------------------------------------------
      # Cache the built toolchain via cachewrtbuild.
      #
      # Its key is <mixkey>-cache-openwrt-<hash of the last commit to
      # tools/ + toolchain/>, so it already rotates when the toolchain
      # sources change. On a hit it patches the Makefile to skip
      # rebuilding the toolchain. The post step (post-if: success())
      # saves it, so a failed build saves nothing.
      #
      # mixkey must NOT include hashFiles('R5C.config'): the toolchain
      # depends on the target and toolchain sources, not on which
      # packages are selected. Including the config hash made adding
      # one package discard a multi-GB toolchain cache.
      #
      # ccache:false is deliberate - with ccache:true this action
      # appends a timestamp to every key and writes a new multi-GB
      # entry per run. ccache has its own weekly cache below.
      # ------------------------------------------------------------
      - name: Cache toolchain
        id: toolchain
        uses: stupidloud/cachewrtbuild@b729f807837dbc3455d02fd35192660d9b662121 # @main pinned 2026-05-10
        with:
          prefix: ${{ github.workspace }}/lede
          mixkey: "nanopi-r5c"
          toolchain: true
          ccache: false

      # ------------------------------------------------------------
      # Reuse downloaded source tarballs and ccache. cachewrtbuild
      # does NOT cache dl/, so we handle it separately.
      #
      # Both are content-addressed: adding/removing packages does not
      # invalidate their entries, so their keys must NOT include
      # hashFiles('R5C.config') - that made any config edit discard
      # both caches. Keep only the target prefix (no cross-target
      # reuse) and the calendar week. Week rotation bounds feed
      # staleness; the prefix fallback plus `make download` covers
      # drift within a week. Keying on the upstream commit instead
      # rotated on every LEDE push (daily), creating a new multi-GB
      # entry each time and evicting the toolchain cache at the
      # repository's 10 GB quota.
      # ------------------------------------------------------------
      # Skipped on reset: entries were deleted above, and the prefix
      # fallback must not resurrect an older snapshot anyway.
      - name: Restore download cache
        if: ${{ inputs.reset_cache != true }}
        id: dl-cache
        uses: actions/cache/restore@v6
        with:
          path: lede/dl
          key: lede-nanopi-r5c-dl-${{ steps.cal.outputs.week }}
          restore-keys: |
            lede-nanopi-r5c-dl-

      # ------------------------------------------------------------
      # R5C.config enables CONFIG_CCACHE=y; rules.mk exports
      # CCACHE_DIR=$(TOPDIR)/.ccache, which matches this path.
      # ------------------------------------------------------------
      - name: Restore ccache
        if: ${{ inputs.reset_cache != true }}
        id: ccache
        uses: actions/cache/restore@v6
        with:
          path: lede/.ccache
          key: lede-nanopi-r5c-ccache-${{ steps.cal.outputs.week }}
          restore-keys: |
            lede-nanopi-r5c-ccache-

      # ------------------------------------------------------------
      # Make cache effectiveness visible before the expensive steps.
      # All three "miss" means this run is effectively a full rebuild.
      # ------------------------------------------------------------
      - name: Cache status
        run: |
          echo "cache reset:   ${{ github.event_name == 'workflow_dispatch' && inputs.reset_cache == true }}"
          echo "toolchain hit: ${{ steps.toolchain.outputs.hit || '0 (miss)' }}"
          echo "dl cache hit:  ${{ steps.dl-cache.outputs.cache-hit || 'skipped (reset)' }}"
          echo "ccache hit:    ${{ steps.ccache.outputs.cache-hit || 'skipped (reset)' }}"
          echo "LEDE commit:   $(git -C lede rev-parse --short HEAD)"
          echo "calendar week: ${{ steps.cal.outputs.week }}"

      # ------------------------------------------------------------
      # Homeproxy from rongxiong/homeproxy.
      #
      # It is a single-package repository: the package Makefile lives at
      # the repository root, so it cannot be registered as a src-git feed
      # (feeds only scan <feed>/<package>/Makefile). Clone it into the
      # buildroot's package/ tree instead. Its Makefile includes
      # $(TOPDIR)/feeds/luci/luci.mk, which `feeds update -a` provides.
      #
      # LEDE's luci feed already ships a package with the same name. Having
      # the fork in package/ first makes `feeds install -a` treat it as a
      # core package and skip the feed copy, leaving one definition only.
      # ------------------------------------------------------------
      - name: Install homeproxy
        working-directory: lede
        run: |
          git clone -b master --single-branch --depth 1 \
            https://github.com/rongxiong/homeproxy.git \
            package/luci-app-homeproxy

          grep -Fq 'PKG_NAME:=luci-app-homeproxy' \
            package/luci-app-homeproxy/Makefile
          echo "homeproxy commit: $(git -C package/luci-app-homeproxy rev-parse --short HEAD)"

      # ------------------------------------------------------------
      # Update package feeds (LEDE's own feeds.conf.default)
      # ------------------------------------------------------------
      - name: Update feeds
        working-directory: lede
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # Normally `feeds install -a` sees the core package installed
          # above and skips the luci feed's luci-app-homeproxy. Remove the
          # link anyway so a feeds behaviour change cannot leave two
          # definitions of the same package in the build.
          rm -f package/feeds/luci/luci-app-homeproxy

      # ------------------------------------------------------------
      # Resolve the seed config and assert the resolved target is
      # really the NanoPi R5C. A typo in the profile symbol would
      # otherwise fall back to LEDE's default x86 target silently.
      # ------------------------------------------------------------
      - name: Prepare configuration
        working-directory: lede
        run: |
          make defconfig

          if [ -e package/feeds/luci/luci-app-homeproxy ]; then
            echo "::error::luci-app-homeproxy is still installed from the luci feed"
            exit 1
          fi

          echo "Final target configuration:"
          grep -E \
            '^CONFIG_TARGET_(BOARD|SUBTARGET|PROFILE|ARCH_PACKAGES)=' \
            .config || true

          if ! grep -q '^CONFIG_TARGET_BOARD="rockchip"$' .config \
             || ! grep -q '^CONFIG_TARGET_SUBTARGET="armv8"$' .config \
             || ! grep -q '^CONFIG_TARGET_PROFILE="DEVICE_friendlyarm_nanopi-r5c"$' .config; then
            echo "::error::R5C.config did not resolve to the NanoPi R5C target"
            exit 1
          fi

          # defconfig silently drops package symbols when a dependency
          # (PCI support, 11ax, feeds) is unavailable. Catch that here
          # instead of shipping a firmware missing explicit features.
          for sym in \
            CONFIG_PACKAGE_kmod-mt7921e \
            CONFIG_PACKAGE_kmod-mt7922-firmware \
            CONFIG_PACKAGE_luci-app-homeproxy \
            CONFIG_PACKAGE_luci-i18n-homeproxy-zh-cn \
            CONFIG_PACKAGE_sing-box \
            CONFIG_PACKAGE_firewall4 \
            CONFIG_PACKAGE_kmod-nft-tproxy \
            CONFIG_PACKAGE_ucode-mod-digest; do
            if ! grep -Fqx "${sym}=y" .config; then
              echo "::error::${sym} was dropped by make defconfig"
              exit 1
            fi
          done

          # DEFAULT_PACKAGES.router supplies LEDE's own LuCI apps. Print
          # what defconfig actually selected so a broken feed cannot
          # silently strip them from the image.
          echo "LEDE LuCI applications selected:"
          grep -E '^CONFIG_PACKAGE_luci-app-.*=y$' .config | sort || true

      # ------------------------------------------------------------
      # Download all source archives first.
      # This makes failures easier to diagnose.
      # Fallback rerun survives flaky upstream mirrors.
      # ------------------------------------------------------------
      - name: Download sources
        id: download
        working-directory: lede
        run: |
          make download -j$(nproc) V=s || make download -j1 V=s

      # ------------------------------------------------------------
      # Build firmware
      # ------------------------------------------------------------
      - name: Build firmware
        id: build
        working-directory: lede
        # fallback rerun produces a readable single-threaded error log
        run: |
          make -j$(nproc) || make -j1 V=s

      # ------------------------------------------------------------
      # Show ccache hit rate for the build
      # ------------------------------------------------------------
      - name: Show ccache statistics
        working-directory: lede
        env:
          CCACHE_DIR: ${{ github.workspace }}/lede/.ccache
        run: |
          ccache --show-stats

      # ------------------------------------------------------------
      # Show generated firmware and assert the R5C sysupgrade image
      # was really produced (upstream image naming does change).
      # ------------------------------------------------------------
      - name: List firmware
        working-directory: lede
        run: |
          echo "Firmware files:"
          find bin/targets -type f \
            \( -name "*.bin" \
            -o -name "*.itb" \
            -o -name "*.img" \
            -o -name "*.gz" \
            -o -name "*.ubi" \
            -o -name "*.tar" \
            -o -name "*.manifest" \
            -o -name "*.json" \) \
            -print | sort

          if ! find bin/targets/rockchip/armv8 -type f \
              -name '*friendlyarm_nanopi-r5c*sysupgrade.img.gz' -print -quit | grep -q .; then
            echo "::error::No NanoPi R5C sysupgrade image was generated"
            exit 1
          fi

      # ------------------------------------------------------------
      # Upload firmware as GitHub Actions artifacts
      # ------------------------------------------------------------
      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: lede-friendlyarm-nanopi-r5c
          path: |
            lede/bin/targets/**/*.bin
            lede/bin/targets/**/*.itb
            lede/bin/targets/**/*.img
            lede/bin/targets/**/*.gz
            lede/bin/targets/**/*.ubi
            lede/bin/targets/**/*.tar
            lede/bin/targets/**/*.manifest
            lede/bin/targets/**/*.json
            lede/bin/targets/**/sha256sums
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      # ------------------------------------------------------------
      # Persist downloaded source tarballs for the next run.
      # (Toolchain is saved by cachewrtbuild's post step.)
      #
      # Only write when this run did not restore the exact key: the
      # key already exists otherwise, and actions/cache/save aborts
      # with "Cache already exists" (which would fail a green build
      # on any re-run). !cancelled() keeps a cancelled/timeout run
      # from uploading a multi-GB snapshot on its way out. Gated on
      # download success so a failed or partial download never
      # poisons the cache; a later build failure still keeps the good
      # dl/ snapshot for resume.
      #
      # On a reset the restore step is skipped, hence the explicit
      # reset branch in the condition instead of relying on the empty
      # cache-hit output. This save recreates the original (now deleted)
      # key with clean data, so the next normal build is warm again.
      # The key is spelled out, not read from a skipped step's output.
      # ------------------------------------------------------------
      - name: Save download cache
        if: ${{ !cancelled() && (inputs.reset_cache == true || steps.dl-cache.outputs.cache-hit != 'true') && steps.download.outcome == 'success' }}
        uses: actions/cache/save@v6
        with:
          path: lede/dl
          key: lede-nanopi-r5c-dl-${{ steps.cal.outputs.week }}

      # ------------------------------------------------------------
      # Persist ccache for the next run. Same exact-hit rule as dl/:
      # at most one new entry per active week.
      # ------------------------------------------------------------
      - name: Save ccache
        if: ${{ !cancelled() && (inputs.reset_cache == true || steps.ccache.outputs.cache-hit != 'true') && steps.build.outcome == 'success' }}
        uses: actions/cache/save@v6
        with:
          path: lede/.ccache
          key: lede-nanopi-r5c-ccache-${{ steps.cal.outputs.week }}

      # ------------------------------------------------------------
      # Create GitHub Release when manually requested
      # ------------------------------------------------------------
      - name: Generate release metadata
        if: github.event_name == 'workflow_dispatch' && inputs.release == true
        id: release
        run: |
          VERSION="$(date +'%Y.%m.%d')-${GITHUB_SHA::7}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          {
            echo "## Lean's LEDE - FriendlyARM NanoPi R5C"
            echo
            echo "- Target: Rockchip RK3568 (rockchip/armv8)"
            echo "- Device: FriendlyARM NanoPi R5C (friendlyarm_nanopi-r5c)"
            echo "- Source: coolsnowwolf/lede@master"
            echo "- Config: R5C.config"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Build: ${VERSION}"
          } > release-notes.md

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.release == true
        uses: softprops/action-gh-release@v3
        with:
          # Prefixed so a same-day Flint2 build cannot reuse this tag.
          tag_name: r5c-${{ steps.release.outputs.version }}
          name: LEDE NanoPi R5C ${{ steps.release.outputs.version }}
          body_path: release-notes.md
          files: |
            lede/bin/targets/**/*.bin
            lede/bin/targets/**/*.itb
            lede/bin/targets/**/*.img
            lede/bin/targets/**/*.gz
            lede/bin/targets/**/*.ubi
            lede/bin/targets/**/*.tar
            lede/bin/targets/**/*.manifest
            lede/bin/targets/**/*.json
            lede/bin/targets/**/sha256sums
