name: Build ImmortalWrt

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Create a GitHub Release"
        required: true
        default: false
        type: boolean

  push:
    branches:
      - main
    paths:
      - ".config"
      - ".github/workflows/Flint2.yml"

  # schedule:
    # Every Sunday at 02:00 UTC
    # - cron: "0 2 * * 0"

permissions:
  contents: write

concurrency:
  group: build-gl-mt6000
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai

jobs:
  build:
    name: Build GL-MT6000
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      # ------------------------------------------------------------
      # Checkout your ImmortalWrt fork/repository
      # ------------------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # ------------------------------------------------------------
      # Free as much disk space as possible.
      # ImmortalWrt recommends at least 25 GB available.
      # ------------------------------------------------------------
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af || true

          df -h

      # ------------------------------------------------------------
      # Install ImmortalWrt build dependencies
      # ------------------------------------------------------------
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ack \
            antlr3 \
            asciidoc \
            autoconf \
            automake \
            autopoint \
            binutils \
            bison \
            build-essential \
            bzip2 \
            ccache \
            clang \
            cmake \
            cpio \
            curl \
            device-tree-compiler \
            ecj \
            fastjar \
            flex \
            gawk \
            gettext \
            gcc-multilib \
            g++-multilib \
            git \
            gnutls-dev \
            gperf \
            haveged \
            help2man \
            intltool \
            lib32gcc-s1 \
            libc6-dev-i386 \
            libelf-dev \
            libglib2.0-dev \
            libgmp3-dev \
            libltdl-dev \
            libmpc-dev \
            libmpfr-dev \
            libncurses-dev \
            libpython3-dev \
            libreadline-dev \
            libssl-dev \
            libtool \
            libyaml-dev \
            libz-dev \
            lld \
            llvm \
            lrzsz \
            mkisofs \
            msmtp \
            ninja-build \
            p7zip \
            p7zip-full \
            patch \
            pkgconf \
            python3 \
            python3-pip \
            python3-ply \
            python3-docutils \
            python3-pyelftools \
            qemu-utils \
            re2c \
            rsync \
            scons \
            squashfs-tools \
            subversion \
            swig \
            texinfo \
            uglifyjs \
            upx-ucl \
            unzip \
            vim \
            wget \
            xmlto \
            xxd \
            zlib1g-dev \
            zstd

      # ------------------------------------------------------------
      # Verify that the uploaded/repository .config exists
      # ------------------------------------------------------------
      - name: Verify build configuration
        run: |
          test -f .config

          echo "Target:"
          grep -E '^CONFIG_TARGET_(BOARD|SUBTARGET|PROFILE)=' .config || true

          echo "Architecture:"
          grep -E '^CONFIG_TARGET_ARCH_PACKAGES=' .config || true

      # ------------------------------------------------------------
      # This repo only carries the configuration; the actual
      # ImmortalWrt source tree is cloned separately.
      # ------------------------------------------------------------
      - name: Clone ImmortalWrt source
        run: |
          git clone -b master --single-branch --filter=blob:none \
            https://github.com/immortalwrt/immortalwrt.git immortalwrt
          cp .config immortalwrt/

      # ------------------------------------------------------------
      # Calendar week for cache rotation. Weekly (not per-commit)
      # rotation bounds feed staleness to ~1 week while keeping
      # steady-state churn at ~1 new entry per cache per active week.
      # ------------------------------------------------------------
      - name: Cache calendar
        id: cal
        run: |
          echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # Cache the built toolchain via cachewrtbuild.
      # On a cache hit it patches the Makefile to skip rebuilding
      # the toolchain; the key auto-rotates when tools/toolchain
      # source commits change. Saved in its post step automatically.
      #
      # ccache is intentionally NOT handled here: with ccache:true
      # this action appends a timestamp to every key, creating a new
      # multi-GB entry on each run. ccache gets its own weekly cache
      # below. mixkey carries the .config hash so a target change
      # can never falsely reuse another target's toolchain.
      # ------------------------------------------------------------
      - name: Cache toolchain
        uses: stupidloud/cachewrtbuild@b729f807837dbc3455d02fd35192660d9b662121 # @main pinned 2026-05-10
        with:
          prefix: ${{ github.workspace }}/immortalwrt
          mixkey: "mt6000-${{ hashFiles('.config') }}"
          toolchain: true
          ccache: false

      # ------------------------------------------------------------
      # Reuse downloaded source tarballs. cachewrtbuild does NOT
      # cache dl/, so we handle it separately.
      #
      # Key is stable within a calendar week on purpose: keying on the
      # upstream commit rotated on every ImmortalWrt push (daily) and
      # created a new multi-GB entry each time, evicting the toolchain
      # cache once the 10 GB quota is reached. Feed drift within the
      # week is covered by the prefix fallback plus `make download`
      # fetching the delta.
      #
      # feeds.conf.default is intentionally excluded: this workflow
      # builds with ImmortalWrt's own default feeds, that file belongs
      # to a different target and must not rotate this cache.
      # ------------------------------------------------------------
      - name: Restore download cache
        id: dl-cache
        uses: actions/cache/restore@v6
        with:
          path: immortalwrt/dl
          key: immortalwrt-gl-mt6000-dl-${{ hashFiles('.config') }}-${{ steps.cal.outputs.week }}
          restore-keys: |
            immortalwrt-gl-mt6000-dl-${{ hashFiles('.config') }}-
            immortalwrt-gl-mt6000-dl-

      # ------------------------------------------------------------
      # Reuse ccache (.config enables CONFIG_CCACHE=y). Weekly key
      # with prefix fallback: warm hits all week, at most one new
      # entry per active week.
      # ------------------------------------------------------------
      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@v6
        with:
          path: immortalwrt/.ccache
          key: immortalwrt-gl-mt6000-ccache-${{ hashFiles('.config') }}-${{ steps.cal.outputs.week }}
          restore-keys: |
            immortalwrt-gl-mt6000-ccache-${{ hashFiles('.config') }}-
            immortalwrt-gl-mt6000-ccache-

      # ------------------------------------------------------------
      # Update package feeds
      # ------------------------------------------------------------
      - name: Update feeds
        working-directory: immortalwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ------------------------------------------------------------
      # Resolve the supplied .config
      # ------------------------------------------------------------
      - name: Prepare configuration
        working-directory: immortalwrt
        run: |
          make defconfig

          echo "Final target configuration:"
          grep -E \
            '^CONFIG_TARGET_(BOARD|SUBTARGET|PROFILE|ARCH_PACKAGES)=' \
            .config || true

      # ------------------------------------------------------------
      # Download all source archives first.
      # This makes failures easier to diagnose.
      # Fallback rerun survives flaky upstream mirrors.
      # ------------------------------------------------------------
      - name: Download sources
        id: download
        working-directory: immortalwrt
        run: |
          make download -j$(nproc) V=s || make download -j1 V=s

      # ------------------------------------------------------------
      # Build firmware
      # ------------------------------------------------------------
      - name: Build firmware
        id: build
        working-directory: immortalwrt
        # fallback rerun produces a readable single-threaded error log
        run: |
          make -j$(nproc) || make -j1 V=s

      # ------------------------------------------------------------
      # Show ccache hit rate for the build
      # ------------------------------------------------------------
      - name: Show ccache statistics
        working-directory: immortalwrt
        env:
          CCACHE_DIR: ${{ github.workspace }}/immortalwrt/.ccache
        run: |
          ccache --show-stats

      # ------------------------------------------------------------
      # Show generated firmware
      # ------------------------------------------------------------
      - name: List firmware
        working-directory: immortalwrt
        run: |
          echo "Firmware files:"
          find bin/targets -type f \
            \( -name "*.bin" \
            -o -name "*.itb" \
            -o -name "*.img" \
            -o -name "*.gz" \
            -o -name "*.ubi" \
            -o -name "*.tar" \
            -o -name "*.manifest" \
            -o -name "*.json" \) \
            -print | sort

      # ------------------------------------------------------------
      # Upload firmware as GitHub Actions artifacts
      # ------------------------------------------------------------
      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: immortalwrt-gl-mt6000
          path: |
            immortalwrt/bin/targets/**/*.bin
            immortalwrt/bin/targets/**/*.itb
            immortalwrt/bin/targets/**/*.img
            immortalwrt/bin/targets/**/*.gz
            immortalwrt/bin/targets/**/*.ubi
            immortalwrt/bin/targets/**/*.tar
            immortalwrt/bin/targets/**/*.manifest
            immortalwrt/bin/targets/**/*.json
            immortalwrt/bin/targets/**/sha256sums
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      # ------------------------------------------------------------
      # Persist downloaded source tarballs for the next run.
      # (Toolchain is saved by cachewrtbuild's post step.)
      #
      # Only write when this run did not restore the exact key: the
      # key already exists otherwise, and actions/cache/save aborts
      # with "Cache already exists" (which would fail a green build
      # on any re-run). Gated on download success so a failed or
      # partial download never poisons the cache; a later build
      # failure still keeps the good dl/ snapshot for resume.
      # ------------------------------------------------------------
      - name: Save download cache
        if: always() && steps.dl-cache.outputs.cache-hit != 'true' && steps.download.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: immortalwrt/dl
          key: ${{ steps.dl-cache.outputs.cache-primary-key }}

      # ------------------------------------------------------------
      # Persist ccache for the next run. Same exact-hit rule as dl/:
      # at most one new entry per active week.
      # ------------------------------------------------------------
      - name: Save ccache
        if: always() && steps.ccache.outputs.cache-hit != 'true' && steps.build.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: immortalwrt/.ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      # ------------------------------------------------------------
      # Create GitHub Release when manually requested
      # ------------------------------------------------------------
      - name: Generate release metadata
        if: github.event_name == 'workflow_dispatch' && inputs.release == true
        id: release
        run: |
          VERSION="$(date +'%Y.%m.%d')-${GITHUB_SHA::7}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          {
            echo "## ImmortalWrt GL-MT6000"
            echo
            echo "- Target: MediaTek Filogic"
            echo "- Device: GL.iNet GL-MT6000"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Build: ${VERSION}"
          } > release-notes.md

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.release == true
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.version }}
          name: ImmortalWrt GL-MT6000 ${{ steps.release.outputs.version }}
          body_path: release-notes.md
          files: |
            immortalwrt/bin/targets/**/*.bin
            immortalwrt/bin/targets/**/*.itb
            immortalwrt/bin/targets/**/*.img
            immortalwrt/bin/targets/**/*.gz
            immortalwrt/bin/targets/**/*.ubi
            immortalwrt/bin/targets/**/*.tar
            immortalwrt/bin/targets/**/*.manifest
            immortalwrt/bin/targets/**/*.json
            immortalwrt/bin/targets/**/sha256sums